[package]
name = "zet-live"
version = "0.2.2"
edition = "2024"

[dependencies]
accept-header = "0.2.3"
anyhow = "1.0.104"
arc-swap = "1.9.2"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["cookie", "query"] }
base64 = "0.23.1"
build-info = "0.0.46"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
cookie = "0.18.2"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.34"
hmac = "0.13"
jiff = { version = "0.2.38", features = ["serde", "tzdb-bundle-always"] }
listenfd = "1.0.2"
mime = "0.3.17"
minicbor-serde = { version = "0.7.1", features = ["full"] }
prost = { version = "0.14.4" }
rand = "0.10.3"
reqwest = { version = "0.13.5", features = ["brotli", "cookies", "deflate", "gzip", "hickory-dns", "json", "multipart", "rustls", "stream"] }
rust_decimal = { version = "1", features = ["serde"] }
rust-embed = { version = "8.12.0", features = ["compression", "deterministic-timestamps", "interpolate-folder-path", "mime-guess"] }
serde = { version = "1.0.229", features = ["alloc", "derive"] }
serde_json = { version = "1.0.151", features = ["alloc"] }
serde_repr = "0.1.21"
serde_with = "3.24.0"
sha2 = "0.11.0"
signal-hook = "0.4.5"
sqlx = { version = "0.9", features = ["json", "macros", "postgres", "runtime-tokio", "rust_decimal", "time"] }
thiserror = "2.0.21"
tikv-jemallocator = "0.7.0"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.19"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "parking_lot"] }
ulid = "3.0.0"
url = { version = "2.5.8", features = ["serde"] }
validator = { version = "0.21.0", features = ["derive"] }
webpki-root-certs = "1.0.9"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
build-info-build = "0.0.46"
prost-build = "0.14.4"

[lints.clippy]
cognitive_complexity = "allow"
default_trait_access = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
uninlined_format_args = "allow"
unnecessary_debug_formatting = "allow"
unwrap_used = "warn"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
