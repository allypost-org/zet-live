[package]
name = "zet-live"
version = "0.2.2"
edition = "2024"

[dependencies]
accept-header = "0.2.3"
anyhow = "1.0.102"
arc-swap = "1.9.2"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-client-ip = "1.3.1"
axum-extra = { version = "0.12.6", features = ["cookie", "query"] }
base64 = "0.22.1"
build-info = "0.0.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap_complete = "4.6.5"
cookie = "0.18.1"
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.32"
hmac = "0.13"
jiff = { version = "0.2.28", features = ["serde"] }
listenfd = "1.0.2"
mime = "0.3.17"
minicbor-serde = { version = "0.7.0", features = ["full"] }
prost = { version = "0.14.4" }
rand = "0.10.1"
reqwest = { version = "0.13.4", features = ["brotli", "cookies", "deflate", "gzip", "hickory-dns", "json", "multipart", "rustls", "stream"] }
rust-embed = { version = "8.12.0", features = ["compression", "deterministic-timestamps", "interpolate-folder-path", "mime-guess"] }
rust_decimal = { version = "1", features = ["serde"] }
serde = { version = "1.0.219", features = ["alloc", "derive"] }
serde_json = { version = "1.0.150", features = ["alloc"] }
serde_repr = "0.1.20"
serde_with = "3.21.0"
sha2 = "0.11.0"
signal-hook = "0.4.4"
sqlx = { version = "0.9", features = ["json", "macros", "postgres", "runtime-tokio", "rust_decimal", "time"] }
thiserror = "2.0.18"
tikv-jemallocator = "0.7.0"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "parking_lot"] }
ulid = "1.2.1"
url = { version = "2.5.8", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
webpki-root-certs = "1.0.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
build-info-build = "0.0.44"
prost-build = "0.14.4"

[lints.clippy]
cognitive_complexity = "allow"
default_trait_access = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
uninlined_format_args = "allow"
unnecessary_debug_formatting = "allow"
unwrap_used = "warn"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
panic = "abort"
codegen-units = 1
